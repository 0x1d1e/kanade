# Kanade's SDDM theme. A theme.conf.user beside this file overrides any key; a bad value
# falls back to its default here, so a mistake never breaks the login screen.
[General]

# a pre-blurred, reduced picture, relative to this directory (e.g. data/backdrop.png); empty is a solid surface
backdrop=

# the signed-in user's picture, relative to this directory (e.g. data/face.png); empty is the user's own icon, else their initial
face=

# how dark the shade over the backdrop is, 0 to 1
shade=0.33

# the font family; empty is Inter Display, else Inter, else the system's sans-serif
font=

# 24-hour clock (true), or 12-hour (false)
clock24=true

# multiplies every size, 0.5 to 4
scale=1

# the session to start, by name (e.g. Niri); empty is the one used last
session=

# the solid surface when there is no backdrop, #rrggbb
surface=#0c0d11
