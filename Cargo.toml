[package]
name = "kanade"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
amane = { git = "https://github.com/MystiaFin/amane", rev = "6ace43e5c69cd4b39bb06b28c20fc4b883422519" }
serde = "1"
toml = { version = "1", default-features = false, features = ["display", "parse", "serde"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

# unoptimised dependencies are too slow for smooth animation; Kanade itself stays
# unoptimised so a save rebuilds quickly
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
