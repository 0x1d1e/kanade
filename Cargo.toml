[package]
name = "kanade"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
amane = { git = "https://github.com/MystiaFin/amane", rev = "30800248fc51a663ec1f852047818641d6218786" }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

# unoptimised dependencies are too slow for smooth animation; Kanade itself stays
# unoptimised so a save rebuilds quickly
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
