# Kanade appearance sync: wallpaper colors through Matugen, rewritten on each change
# included at the end of kitty.conf, so it wins over an earlier theme; running kittys reload it
# on SIGUSR1. The ANSI colors are Matugen custom colors, their hues toned for the wallpaper

foreground {{on_surface}}
background {{surface}}
cursor {{on_surface}}
cursor_text_color {{surface}}
cursor_trail_color {{on_surface_variant}}
selection_foreground {{on_secondary_container}}
selection_background {{secondary_container}}
url_color {{primary}}

active_border_color {{primary}}
inactive_border_color {{outline_variant}}
bell_border_color {{error}}

tab_bar_background {{surface}}
active_tab_foreground {{on_primary}}
active_tab_background {{primary}}
inactive_tab_foreground {{on_surface_variant}}
inactive_tab_background {{surface_container}}

color0 {{ansi_black}}
color1 {{kanade_red}}
color2 {{kanade_green}}
color3 {{kanade_yellow}}
color4 {{kanade_blue}}
color5 {{kanade_magenta}}
color6 {{kanade_cyan}}
color7 {{ansi_white}}
color8 {{ansi_bright_black}}
color9 {{ansi_bright_red}}
color10 {{ansi_bright_green}}
color11 {{ansi_bright_yellow}}
color12 {{ansi_bright_blue}}
color13 {{ansi_bright_magenta}}
color14 {{ansi_bright_cyan}}
color15 {{ansi_bright_white}}
