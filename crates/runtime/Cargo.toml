[package]
name = "kanade-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The new platform/runtime is developed beside the existing Amane shell until
# every public Kanade behavior has a tested native implementation.
[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }

wgpu = { version = "29", default-features = true }
tempfile = "3"
rustix = { version = "1", features = ["event"] }
xkbcommon = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
