[package]
name = "kanade-install"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The install TUI. Ratatui and crossterm stay in this crate; the shell binary does not depend on them.
# It only calls scripts/install (ADR 0122).

[[bin]]
name = "kanade-install"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
portable-pty = "0.9"
